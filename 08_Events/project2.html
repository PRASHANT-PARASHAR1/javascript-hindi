<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    margin: 0;                                                                                                                                                                                              
    padding: 0;
    background: #212121;
    color: white;
    font-family: Arial, Helvetica, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.project{
    text-align: center;
}

.key{
    font-size: 24px;
    font-weight: bold;
}

.color{
    display: flex;
    justify-content: center;
    margin-top: 20px;
}

table{
    width: 500px;
    border-collapse: collapse;
    border-radius: 10px;
    overflow: hidden;
    background: #2c2c2c;
    box-shadow: 0 0 15px rgba(0,0,0,0.5);
}

th{
    background: #00b894;
    color: white;
    padding: 15px;
    font-size: 18px;
}

td{
    padding: 15px;
    text-align: center;
    border: 1px solid #444;
    font-size: 16px;
}

tr:nth-child(even){
    background: #3a3a3a;
}

tr:hover{
    background: #4b4b4b;
    transition: 0.3s;
}
    </style>
</head>
<body>
    <div class="project">
        <div id="insert">
        <div class="key">press  the key and watch magic</div>
    </div>
    </div>
</body>
<script>
    const insert = document.getElementById('insert')
    window.addEventListener('keydown',(e) =>{
        insert.innerHTML=`
        <div class='color'>
            <table>
  <tr>
    <th>key</th>
    <th>keycode</th>
    <th>code</th>
  </tr>
  <tr>
    <td>${e.key===" "? "space":e.key}</td>
    <td>${e.keyCode}</td>
    <td>${e.code}</td>
  </tr>
  
</table>
            </div>
        `
    })
</script>
</html>
